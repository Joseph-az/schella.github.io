<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schella — Locks, Perruques & Formations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --wine:#5C2A3A;
    --wine-dark:#43111F;
    --caramel:#C6863F;
    --caramel-light:#E4B278;
    --cream:#FBF4EC;
    --ivory:#FFFDF9;
    --charcoal:#2A2019;
    --charcoal-soft:#6B5D53;
    --line:#EAE0D3;
    --success:#3F6C51;
    --danger:#A3403C;
    --radius:18px;
    --radius-sm:10px;
    --shadow: 0 10px 30px -12px rgba(42,32,25,0.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--charcoal);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.serif{font-family:'Fraunces', serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  .container{max-width:1180px;margin:0 auto;padding:0 20px;}
  .wrap-narrow{max-width:720px;margin:0 auto;padding:0 20px;}

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--caramel);
    outline-offset:2px;
    border-radius:6px;
  }

  ::selection{background:var(--caramel-light);}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;
    border:1px solid transparent; transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--wine);color:var(--ivory);}
  .btn-primary:hover{background:var(--wine-dark); box-shadow:var(--shadow);}
  .btn-outline{background:transparent;border-color:var(--charcoal);color:var(--charcoal);}
  .btn-outline:hover{background:var(--charcoal);color:var(--ivory);}
  .btn-cream{background:var(--ivory);color:var(--wine);}
  .btn-cream:hover{background:var(--caramel-light);color:var(--wine-dark);}
  .btn-whatsapp{background:#25D366; color:#0b3d1f;}
  .btn-whatsapp:hover{background:#1ebc59;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none;}
  .btn-ghost{background:transparent;color:var(--wine);padding:8px 4px;font-weight:600;}
  .btn-ghost:hover{text-decoration:underline;}
  .btn-danger-outline{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger);color:#fff;}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.02em;}
  .pill-caramel{background:rgba(198,134,63,0.15);color:#8a5a24;}
  .pill-wine{background:rgba(92,42,58,0.1);color:var(--wine);}
  .pill-success{background:rgba(63,108,81,0.13);color:var(--success);}
  .pill-danger{background:rgba(163,64,60,0.12);color:var(--danger);}
  .pill-muted{background:#EFE7DA;color:var(--charcoal-soft);}

  .card{background:var(--ivory);border-radius:var(--radius);border:1px solid var(--line);}
  .fade-in{animation:fadeIn .45s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ===== Public site chrome ===== */
  .site-header{position:sticky;top:0;z-index:40;background:rgba(251,244,236,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .site-header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1180px;margin:0 auto;}
  .logo{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:.01em;color:var(--wine);}
  .nav-desktop{display:none;gap:32px;align-items:center;}
  .nav-desktop a{font-size:15px;font-weight:500;color:var(--charcoal);position:relative;padding:4px 0;}
  .nav-desktop a.active{color:var(--wine);}
  .nav-desktop a.active::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--caramel);border-radius:2px;}
  .nav-cta{display:none;}
  .burger{background:none;border:none;padding:8px;}
  @media(min-width:900px){
    .nav-desktop{display:flex;}
    .nav-cta{display:inline-flex;}
    .burger{display:none;}
  }
  .mobile-menu{position:fixed;inset:0;background:var(--ivory);z-index:60;padding:24px 20px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;}
  .mobile-menu.open{transform:translateX(0);}
  .mobile-menu a{padding:16px 4px;font-size:19px;border-bottom:1px solid var(--line);font-family:'Fraunces',serif;}
  .mobile-menu .mm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}

  .site-footer{background:var(--wine-dark);color:#F3E6DC;margin-top:100px;padding:56px 0 28px;}
  .site-footer a{opacity:.85;}
  .site-footer a:hover{opacity:1;text-decoration:underline;}
  .footer-grid{display:grid;gap:32px;grid-template-columns:1fr;}
  @media(min-width:800px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr;}}

  .sticky-mobile-cta{position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--ivory);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.06);}
  @media(min-width:900px){.sticky-mobile-cta{display:none;}}
  body.has-sticky-cta{padding-bottom:76px;}

  /* Hero */
  .hero{position:relative;overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:36px;align-items:center;padding:36px 0 56px;}
  @media(min-width:920px){.hero-grid{grid-template-columns:1.05fr .95fr;padding:64px 0 90px;}}
  .hero-eyebrow{color:var(--caramel);font-weight:600;font-size:14px;letter-spacing:.03em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .hero h1{font-size:40px;line-height:1.08;font-weight:500;margin:0 0 20px;color:var(--wine-dark);}
  @media(min-width:640px){.hero h1{font-size:54px;}}
  @media(min-width:1100px){.hero h1{font-size:62px;}}
  .hero p.lead{font-size:18px;color:var(--charcoal-soft);max-width:480px;margin:0 0 32px;line-height:1.6;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;}
  .hero-visual{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(160deg,var(--caramel-light),var(--wine));box-shadow:var(--shadow);}
  .hero-visual .tag{position:absolute;left:20px;bottom:20px;background:rgba(255,253,249,0.92);backdrop-filter:blur(4px);padding:14px 18px;border-radius:14px;display:flex;gap:10px;align-items:center;max-width:250px;}

  /* Section headers */
  .section{padding:64px 0;}
  .section-head{display:flex;flex-direction:column;gap:10px;margin-bottom:34px;}
  .section-head h2{font-size:30px;font-weight:500;color:var(--wine-dark);margin:0;}
  @media(min-width:700px){.section-head h2{font-size:36px;}}
  .section-head p{color:var(--charcoal-soft);margin:0;max-width:560px;font-size:16px;line-height:1.6;}
  .section-head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}

  /* grids */
  .grid{display:grid;gap:22px;}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .grid-4{grid-template-columns:1fr;}
  @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:1fr 1fr;}}
  @media(min-width:920px){.grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}}

  .service-card{overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;}
  .service-card:hover{box-shadow:var(--shadow); transform:translateY(-3px);}
  .service-photo{aspect-ratio:5/4;background-size:cover;background-position:center;}
  .service-body{padding:20px;}
  .service-body h3{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--wine-dark);}
  .service-body p{margin:0 0 14px;color:var(--charcoal-soft);font-size:14.5px;line-height:1.55;}
  .service-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--charcoal-soft);margin-bottom:16px;}

  .formation-card{overflow:hidden;}
  .formation-photo{aspect-ratio:16/10;background-size:cover;background-position:center;position:relative;}
  .formation-badge{position:absolute;top:14px;left:14px;}
  .formation-body{padding:20px;}
  .formation-body h3{margin:0 0 10px;font-size:19px;color:var(--wine-dark);}
  .formation-info-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--charcoal-soft);margin-bottom:6px;}
  .places-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 8px;}
  .places-bar-fill{height:100%;background:var(--caramel);border-radius:999px;}

  .testimonial{padding:24px;}
  .testimonial .stars{color:var(--caramel);margin-bottom:10px;}
  .testimonial p{font-style:italic;color:var(--charcoal);line-height:1.6;margin:0 0 16px;font-size:15px;}
  .testimonial .who{display:flex;align-items:center;gap:10px;}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--caramel-light),var(--wine));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-family:'Fraunces',serif;}

  .cta-band{background:var(--wine);border-radius:28px;padding:52px 30px;text-align:center;color:var(--ivory);}
  .cta-band h2{color:var(--ivory);margin:0 0 12px;font-size:30px;}
  @media(min-width:700px){.cta-band h2{font-size:36px;}}
  .cta-band p{opacity:.9;margin:0 0 28px;max-width:520px;margin-left:auto;margin-right:auto;}
  .cta-band .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--charcoal-soft);margin-bottom:22px;flex-wrap:wrap;}
  .breadcrumb a:hover{text-decoration:underline;}

  /* Booking / steps */
  .stepper{display:flex;align-items:center;gap:6px;margin-bottom:36px;overflow-x:auto;padding-bottom:4px;}
  .step-dot{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .step-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--line);color:var(--charcoal-soft);flex-shrink:0;}
  .step-num.active{background:var(--wine);color:var(--ivory);}
  .step-num.done{background:var(--success);color:#fff;}
  .step-label{font-size:13.5px;color:var(--charcoal-soft);font-weight:500;}
  .step-label.active{color:var(--wine);font-weight:600;}
  .step-sep{width:22px;height:1.5px;background:var(--line);flex-shrink:0;}

  .choice-card{border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:14px;background:var(--ivory);transition:.15s ease;width:100%;text-align:left;}
  .choice-card:hover{border-color:var(--caramel);}
  .choice-card.selected{border-color:var(--wine);background:rgba(92,42,58,0.05);box-shadow:0 0 0 3px rgba(92,42,58,0.08);}
  .choice-icon{width:48px;height:48px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--wine);}

  .calendar{background:var(--ivory);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
  .cal-dow{font-size:12px;color:var(--charcoal-soft);font-weight:600;padding:6px 0;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;border:1px solid transparent;background:none;color:var(--charcoal);}
  .cal-day.disabled{color:#D6C9B8;cursor:not-allowed;}
  .cal-day.available:hover{border-color:var(--caramel);}
  .cal-day.selected{background:var(--wine);color:#fff;font-weight:700;}
  .cal-day.today{border-color:var(--caramel);font-weight:700;}
  .cal-day.empty{visibility:hidden;}

  .slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:520px){.slot-grid{grid-template-columns:repeat(3,1fr);}}
  .slot-btn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--ivory);font-weight:600;font-size:15px;text-align:center;}
  .slot-btn.available:hover{border-color:var(--caramel);}
  .slot-btn.selected{background:var(--wine);color:#fff;border-color:var(--wine);}
  .slot-btn.unavailable{background:#F3EDE3;color:#C7BAA9;text-decoration:line-through;cursor:not-allowed;}
  .slot-btn small{display:block;font-weight:400;font-size:11px;margin-top:2px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px;color:var(--charcoal);}
  .field .optional{font-weight:400;color:var(--charcoal-soft);font-size:12.5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:var(--ivory);color:var(--charcoal);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--wine);outline:none;}
  .field textarea{resize:vertical;min-height:90px;}
  .field-error{color:var(--danger);font-size:12.5px;margin-top:6px;display:none;align-items:center;gap:5px;}
  .field.has-error input, .field.has-error textarea{border-color:var(--danger);}
  .field.has-error .field-error{display:flex;}

  .summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .label{color:var(--charcoal-soft);}
  .summary-row .value{font-weight:600;text-align:right;}

  .success-check{width:76px;height:76px;border-radius:50%;background:rgba(63,108,81,0.12);display:flex;align-items:center;justify-content:center;color:var(--success);margin:0 auto 24px;}

  .gallery-item{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background-size:cover;background-position:center;}
  .gallery-item .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(42,32,25,0.85),rgba(42,32,25,0) 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;}
  .gallery-item .wave-tag{font-size:12px;opacity:.85;margin-bottom:4px;}
  .gallery-item h3{margin:0 0 6px;font-size:18px;color:#fff;}
  .gallery-item .meta{display:flex;gap:12px;font-size:12.5px;opacity:.9;}

  .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:640px){.photo-grid{grid-template-columns:repeat(3,1fr);}}
  .photo-grid .ph{aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center;}

  .video-player{aspect-ratio:16/9;border-radius:var(--radius);background:linear-gradient(135deg,var(--wine-dark),var(--wine));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;}
  .video-player .play-btn{width:76px;height:76px;border-radius:50%;background:rgba(255,253,249,0.92);display:flex;align-items:center;justify-content:center;color:var(--wine);transition:transform .2s;}
  .video-player:hover .play-btn{transform:scale(1.08);}
  .video-player .vlabel{position:absolute;bottom:16px;left:18px;color:#fff;font-size:13px;opacity:.85;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:14px 22px;border-radius:12px;font-size:14.5px;display:flex;align-items:center;gap:10px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s ease both;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  /* ===== Admin shell ===== */
  .admin-body{background:#F5F1EA;min-height:100vh;}
  .admin-shell{display:flex;min-height:100vh;}
  .admin-sidebar{width:250px;background:var(--wine-dark);color:#F3E6DC;flex-shrink:0;display:none;flex-direction:column;padding:22px 16px;}
  @media(min-width:900px){.admin-sidebar{display:flex;}}
  .admin-logo{font-family:'Fraunces',serif;font-size:22px;color:#fff;padding:0 10px 24px;}
  .admin-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .admin-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:#E6D6C8;}
  .admin-nav a:hover{background:rgba(255,255,255,0.06);}
  .admin-nav a.active{background:rgba(255,255,255,0.12);color:#fff;}
  .admin-foot{border-top:1px solid rgba(255,255,255,0.12);padding-top:16px;margin-top:16px;}
  .admin-foot a{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px;color:#E6D6C8;}

  .admin-main{flex:1;min-width:0;}
  .admin-topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;}
  @media(min-width:900px){.admin-topbar{display:none;}}
  .admin-content{padding:24px 18px 60px;max-width:1180px;}
  @media(min-width:900px){.admin-content{padding:36px 40px 60px;}}

  .admin-mobile-nav{position:fixed;inset:0;background:var(--wine-dark);z-index:60;padding:20px;transform:translateX(-100%);transition:transform .25s ease;color:#fff;overflow-y:auto;}
  .admin-mobile-nav.open{transform:translateX(0);}
  .admin-mobile-nav a{display:flex;align-items:center;gap:12px;padding:14px 8px;font-size:16px;border-bottom:1px solid rgba(255,255,255,0.1);color:#F3E6DC;}

  .kpi-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:32px;}
  @media(min-width:640px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  .kpi-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;}
  .kpi-card .num{font-family:'Fraunces',serif;font-size:34px;color:var(--wine);font-weight:600;}
  .kpi-card .lbl{color:var(--charcoal-soft);font-size:14px;margin-top:4px;}
  .kpi-card .icn{width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--caramel);margin-bottom:14px;}

  .admin-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:24px;}
  .admin-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .admin-panel-head h3{margin:0;font-size:18px;color:var(--wine-dark);}

  table.admin-table{width:100%;border-collapse:collapse;font-size:14.5px;}
  table.admin-table th{text-align:left;padding:10px 12px;color:var(--charcoal-soft);font-weight:600;font-size:13px;border-bottom:2px solid var(--line);white-space:nowrap;}
  table.admin-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.admin-table tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .admin-row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--charcoal-soft);}
  .icon-btn:hover{border-color:var(--wine);color:var(--wine);}

  .appt-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .appt-row:last-child{border-bottom:none;}
  .appt-time{width:64px;flex-shrink:0;font-weight:700;color:var(--wine);}
  .appt-info{flex:1;min-width:0;}
  .appt-info .n{font-weight:600;}
  .appt-info .s{color:var(--charcoal-soft);font-size:13.5px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(42,32,25,0.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:700px){.modal-overlay{align-items:center;}}
  .modal{background:#fff;border-radius:20px 20px 0 0;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;animation:modalUp .25s ease both;}
  @media(min-width:700px){.modal{border-radius:20px;}}
  @keyframes modalUp{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}

function parseHash(){
  let h = window.location.hash.replace(/^#\/?/, "");
  if(!h) h = "home";
  const [path, query] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  if(query){ query.split("&").forEach(p=>{ const [k,v]=p.split("="); params[k]=decodeURIComponent(v||""); }); }
  return {parts, params};
}

function render(){
  const {parts, params} = parseHash();
  state.params = params;
  const root = parts[0] || "home";
  const app = document.getElementById("app");

  } else {
    app.innerHTML = renderPublic(root, parts.slice(1), params);

}

function stepperHTML(current){
  const steps = ["Prestation","Date","Heure","Vos infos","Confirmation"];
  return `<div class="stepper">
    ${steps.map((s,i)=>{
      const n=i+1;
      const cls = n<current?"done":(n===current?"active":"");
      return `<div class="step-dot">
        <div class="step-num ${cls}">${n<current?'<i data-lucide="check" style="width:14px;height:14px;"></i>':n}</div>
        <span class="step-label ${n===current?'active':''}">${s}</span>
      </div>${i<steps.length-1?'<div class="step-sep"></div>':''}`;
    }).join("")}
  </div>`;
}

function pageBooking(){
  const b = state.booking;
  if(params_service_once()) { /* preselect from query once */ }
  const preselect = state.params.service;
  if(preselect && !b.serviceId && b.step===1){ b.serviceId = preselect; }

  let inner = "";
  if(b.step===1) inner = bookingStep1();
  else if(b.step===2) inner = bookingStep2();
  else if(b.step===3) inner = bookingStep3();
  else if(b.step===4) inner = bookingStep4();
  else if(b.step===5) inner = bookingStep5();
  else if(b.step===6) return bookingSuccess();

  return `

    <div class="breadcrumb"><a href="#/home">Accueil</a> <i data-lucide="chevron-right" style="width:13px;height:13px;"></i> <span>Prendre rendez-vous</span></div>
    <div class="wrap-narrow" style="max-width:820px;padding:0;">
      ${stepperHTML(b.step)}
      <div class="fade-in" key="${b.step}">${inner}</div>
    </div>
  </section>`;
}

function selectService(id){ state.booking.serviceId = id; render(); }

function bookingStep2(){
  const b = state.booking;
  const month = state.calMonth;
  const monthLabel = month.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
  const firstDay = new Date(month.getFullYear(), month.getMonth(), 1);
  const startOffset = (firstDay.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const todayRef = new Date(2026,8,9); // "today" reference for prototype
  let cells = "";
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(month.getFullYear(), month.getMonth(), d);
    const iso = dateObj.toISOString().slice(0,10);
    const isPast = dateObj < new Date(todayRef.getFullYear(),todayRef.getMonth(),todayRef.getDate());
    const isSunday = dateObj.getDay()===0;
    const disabled = isPast || isSunday;
    const isToday = iso === todayRef.toISOString().slice(0,10);
    const isSelected = b.date === iso;
    cells += `<button class="cal-day ${disabled?'disabled':'available'} ${isToday?'today':''} ${isSelected?'selected':''}" ${disabled?'disabled':''} onclick="selectDate('${iso}')" aria-label="${d} ${monthLabel}">${d}</button>`;
  }
  return `
  <h2 style="margin:0 0 8px;font-size:26px;color:var(--wine-dark);">Choisissez une date</h2>
  <p style="color:var(--charcoal-soft);margin:0 0 22px;">Service sélectionné : <strong>${serviceById(b.serviceId)?.name || ''}</strong></p>

    <div class="cal-head">
      <button class="icon-btn" onclick="changeMonth(-1)" aria-label="Mois précédent"><i data-lucide="chevron-left" style="width:18px;height:18px;"></i></button>
      <strong style="text-transform:capitalize;">${monthLabel}</strong>
      <button class="icon-btn" onclick="changeMonth(1)" aria-label="Mois suivant"><i data-lucide="chevron-right" style="width:18px;height:18px;"></i></button>
    </div>
    <div class="cal-grid">
      ${["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:26px;">
    <button class="btn btn-outline" onclick="bookingBack()"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Retour</button>
    <button class="btn btn-primary" ${!b.date?'disabled':''} onclick="bookingNext()">Continuer <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
  </div>`;
}
function selectDate(iso){ state.booking.date = iso; state.booking.time=null; render(); }
function changeMonth(delta){ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+delta, 1); render(); }

function submitBookingInfo(){
  const f = state.booking.form;
  const nomField = document.getElementById("bf-nom").closest(".field");
  const prenomField = document.getElementById("bf-prenom").closest(".field");
  const telField = document.getElementById("bf-tel").closest(".field");
  [nomField,prenomField,telField].forEach(el=>el.classList.remove("has-error"));
  let ok = true;
  if(!f.prenom.trim()){ prenomField.classList.add("has-error"); ok=false; }
  if(!f.nom.trim()){ nomField.classList.add("has-error"); ok=false; }
  if(!f.tel.trim()){ telField.classList.add("has-error"); ok=false; }
  if(!ok){ toast("Merci de compléter les champs requis.", "alert-circle"); return; }
  bookingNext();
}

  state.inscription.done = true;

  document.querySelectorAll("#formatToggle button").forEach(b=>b.classList.remove("active"));

    fields.innerHTML = `

function attachGlobalHandlers(){
  document.addEventListener("keydown", escListener);
}
function escListener(e){
  if(e.key==="Escape"){
    const mm = document.getElementById("mobileMenu"); if(mm) mm.classList.remove("open");
    const amn = document.getElementById("adminMobileNav"); if(amn) amn.classList.remove("open");
    closeModal();
    document.body.style.overflow = "";
  }
}
